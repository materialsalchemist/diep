[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diep-pyg"
version = "1.0.0"
description = "DIEP interatomic potential (PyTorch Geometric) trained on MatPES r2SCAN, with the code that trained it"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Exact versions used for training and testing are in requirements.txt / environment.yml.
dependencies = [
    "torch>=2.1",
    "torch-geometric>=2.5",
    "lightning>=2.2",
    "torchmetrics>=1.0",
    "pymatgen>=2024.1.1",
    "ase>=3.23",
    "numpy",
    "scipy",
    "monty",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
data = ["matpes"]                    # only for downloading MatPES in diep_pyg.matpes build
plot = ["matplotlib", "pandas"]      # tools/training_curves.py
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["diep_pyg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
